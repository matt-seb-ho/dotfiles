# ---------------------------------------------------------------------------
# Gruvbox — https://github.com/morhetz/gruvbox
# ---------------------------------------------------------------------------
# Retro groove. Warm, high-contrast, sepia-toned. Structure differs from Rosé
# Pine: a dark ramp, a light ramp, and three saturation tiers of accents
# (bright / neutral / faded). Dark themes use `bright` accents on the dark ramp;
# light themes use `faded` accents on the light ramp. `neutral` is the middle
# ground and what the 16-color terminal palette uses.
gruvbox:
  source: https://github.com/morhetz/gruvbox/blob/master/colors/gruvbox.vim
  dark_ramp:      # backgrounds for dark mode, fg for light mode
    dark0_hard:  "#1d2021"
    dark0:       "#282828"   # default dark bg
    dark0_soft:  "#32302f"
    dark1:       "#3c3836"
    dark2:       "#504945"
    dark3:       "#665c54"
    dark4:       "#7c6f64"
  light_ramp:     # backgrounds for light mode, fg for dark mode
    light0_hard: "#f9f5d7"
    light0:      "#fbf1c7"   # default light bg
    light0_soft: "#f2e5bc"
    light1:      "#ebdbb2"   # default dark-mode fg
    light2:      "#d5c4a1"
    light3:      "#bdae93"
    light4:      "#a89984"
  gray:          "#928374"   # comments, in both modes
  bright:         # accents for dark backgrounds
    red:    "#fb4934"
    green:  "#b8bb26"
    yellow: "#fabd2f"
    blue:   "#83a598"
    purple: "#d3869b"
    aqua:   "#8ec07c"
    orange: "#fe8019"
  neutral:        # terminal 16-color set
    red:    "#cc241d"
    green:  "#98971a"
    yellow: "#d79921"
    blue:   "#458588"
    purple: "#b16286"
    aqua:   "#689d6a"
    orange: "#d65d0e"
  faded:          # accents for light backgrounds
    red:    "#9d0006"
    green:  "#79740e"
    yellow: "#b57614"
    blue:   "#076678"
    purple: "#8f3f71"
    aqua:   "#427b58"
    orange: "#af3a03"

