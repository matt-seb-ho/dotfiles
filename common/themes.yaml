# Four flavors sharing one role vocabulary: 14 named accents plus a 12-step
# neutral ramp from `crust` (deepest) through `base` (default bg) up to `text`.
# Ramp order, dark to light in dark flavors:
#   crust < mantle < base < surface0 < surface1 < surface2
