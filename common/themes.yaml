# Color palette reference
#
# A single source of truth for the colorschemes I like, so Claude (or I) can be
# pointed at this file for any front-end / theming / color-customization work
# instead of guessing hexes from memory.
#
# Preference order:
#   1. Rosé Pine Dawn   <- daily driver (light)
#   2. Rosé Pine / Moon <- dark counterparts
#   3. Gruvbox          <- long-time former default, still fond of it
#   4. Everforest / Kanagawa / Catppuccin <- evaluated at various points
#
# Values pulled from upstream sources (see `source:` on each theme), not eyeballed.
# Last verified: 2026-09-09

meta:
  default: rose-pine-dawn
  fallback_dark: rose-pine-moon

# ---------------------------------------------------------------------------
# Rosé Pine — https://rosepinetheme.com
# ---------------------------------------------------------------------------
# Role model (same 12 semantic names across all three variants, so a theme
# written against these names works in any variant by swapping the block):
#
#   base            main background
#   surface         raised background (floats, panels, sidebars)
#   overlay         popups / menus, one step above surface
#   muted           de-emphasized text: comments, line numbers, disabled
#   subtle          secondary text, punctuation, borders
#   text            primary foreground
#   love            red        — errors, deletions, keywords
#   gold            yellow     — warnings, constants, strings (in some ports)
#   rose            soft pink  — parameters, inline accents
#   pine            teal/blue  — functions, primary accent (dark on dawn)
#   foam            cyan       — types, hints, links
#   iris            purple     — operators, special, secondary accent
#   highlight_low   cursorline / subtle row highlight
#   highlight_med   visual selection
#   highlight_high  borders, cursor, strongest divider
#   leaf            muted green (nvim port extra; not in the core 12)
#
rose-pine:
  source: https://github.com/rose-pine/rose-pine-palette (palette.json) + rose-pine/neovim palette.lua
  note: >
    Upstream bumped dawn's `text` from #575279 to #464261 for contrast. Older
    configs in this repo (e.g. jagaimo/kitty/current-theme.conf) still carry
    #575279 — both are "correct", just different vintages. Prefer #464261.
  variants:

    main:            # the original dark
      appearance: dark
      base:           "#191724"
      surface:        "#1f1d2e"
      overlay:        "#26233a"
      muted:          "#6e6a86"
      subtle:         "#908caa"
      text:           "#e0def4"
      love:           "#eb6f92"
      gold:           "#f6c177"
      rose:           "#ebbcba"
      pine:           "#31748f"
      foam:           "#9ccfd8"
      iris:           "#c4a7e7"
      leaf:           "#95b1ac"
      highlight_low:  "#21202e"
      highlight_med:  "#403d52"
      highlight_high: "#524f67"
      inactive_bg:    "#16141f"   # `_nc` — unfocused split background

    moon:            # softer, slightly warmer dark
      appearance: dark
      base:           "#232136"
      surface:        "#2a273f"
      overlay:        "#393552"
      muted:          "#6e6a86"
      subtle:         "#908caa"
      text:           "#e0def4"
      love:           "#eb6f92"
      gold:           "#f6c177"
      rose:           "#ea9a97"
      pine:           "#3e8fb0"
      foam:           "#9ccfd8"
      iris:           "#c4a7e7"
      leaf:           "#95b1ac"
      highlight_low:  "#2a283e"
      highlight_med:  "#44415a"
