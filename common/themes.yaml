# ---------------------------------------------------------------------------
# Cross-theme role mapping cheat sheet
# ---------------------------------------------------------------------------
# Useful when porting a design from one palette to another. Read across a row.
#
#   role            rose-pine      gruvbox          everforest   kanagawa(wave)  catppuccin
#   ------------    -------------  ---------------  -----------  --------------  ----------
#   background      base           dark0/light0     bg0          ui.bg           base
#   raised bg       surface        dark0_soft       bg1          ui.bg_p1        mantle/surface0
#   popup bg        overlay        dark1            bg2          ui.bg_m3        surface0
#   body text       text           light1/dark1     fg           ui.fg           text
#   dim text        subtle         light4/dark4     grey2        ui.fg_dim       subtext0
#   comment         muted          gray             grey1        fujiGray        overlay0
#   error / delete  love           red              red          samuraiRed      red
#   warning         gold           yellow           yellow       roninYellow     yellow
#   success / add   pine (or leaf) green            green        autumnGreen     green
#   info / link     foam           aqua             aqua         dragonBlue      sky/sapphire
#   primary accent  pine           blue             blue         crystalBlue     blue
#   secondary       iris           purple           purple       oniViolet       mauve
#   tertiary        rose           orange           orange       surimiOrange    peach
#   selection bg    highlight_med  dark2/light2     bg_visual    ui.bg_visual    surface1
#   cursorline      highlight_low  dark0_soft       bg1          ui.bg_p2        surface0
#   border          highlight_high dark3/light3     bg5          ui.bg_p2        surface2

# ---------------------------------------------------------------------------
# Derived palette: ActivityWatch category colors  (OFFICIAL — 2026-09-09)
# ---------------------------------------------------------------------------
# Canonical source for the 16 ActivityWatch categories. Mirrored into
# aw-category-export.json (importable) and live in the aw-server settings.
#
# TWO CONSTRAINTS DRIVE EVERYTHING HERE:
#
# 1. Category colors are TEXT BACKGROUNDS, not accents.
#    aw-webui's src/visualizations/summary.ts hardcodes `const textColor =
#    '#333'` and paints every bar label in it, regardless of fill and
#    regardless of light/dark theme. Rosé Pine accents used as fills give #333
#    only 2.0-4.8:1 — unreadable. A legible fill needs luminance >= ~0.45.
#
# 2. Low chroma limits how many colors can coexist.
#    At the saturation of "london sands" (.22) / "butterfly kisses" (.13) from
#    obsidian/00_fleeting/pastel_schemes.md, 16 mutually distinct colors do not
#    fit. So the budget follows actual usage: Work's children (kitty, zen,
#    obsidian, LLM) dominate the chart and carry the hue separation; Media and
#    Comms are slivers and recede into quiet greige ladders separated by
#    lightness.
#
# Verified:
#   worst label contrast (#333 on fill)     4.95:1  (WCAG AA text = 4.5:1)
#   min deltaE among categories in daily use  11.6
#   mean saturation                          0.26   (london sands .22)
#   remaining tight pairs                    5, all near-white slivers
#
# Yellow-green (~60-100 deg) is avoided outright; it read sickly at these
# lightnesses in an earlier revision.
#
activitywatch-categories:
  note: >
    Fills carry dark #333 labels, so these are backgrounds, not accents.
    Do not swap in rose-pine accent hexes — see the header above.
  label_color: "#333333"          # hardcoded in aw-webui summary.ts
  min_fill_luminance: 0.45
  inspired_by: ["london sands", "butterfly kisses"]

